name: Publish npm packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.13.0'
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Check release versions
        run: |
          pnpm --filter './packages/**' -r exec node -e '
            const { name, version } = require("./package.json");
            if (version === "0.0.0" || !/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(name + " needs a stable release version above 0.0.0");
            }'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Publish new workspace versions to npm
        run: pnpm --filter './packages/**' -r publish --access public --no-git-checks
