name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        type: choice
        required: true
        default: stable
        options:
          - stable
          - prepatch

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.13.0'
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Prepare release versions
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          pnpm --filter './packages/**' -r exec node -e '
            const fs = require("node:fs");
            const pkg = require("./package.json");
            const { version } = pkg;
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(pkg.name + " needs a stable base version");
            }
            if (process.env.RELEASE_TYPE === "prepatch") {
              const [major, minor, patch] = version.split(".");
              pkg.version = major + "." + minor + "." + (Number(patch) + 1) + "-beta." + process.env.GITHUB_RUN_NUMBER;
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
              console.log(pkg.name, pkg.version);
            } else if (version === "0.0.0") {
              throw new Error(pkg.name + " needs a stable release version above 0.0.0");
            }'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Publish new workspace versions to npm
        env:
          RELEASE_TAG: ${{ inputs.release_type == 'prepatch' && 'beta' || 'latest' }}
        run: pnpm --filter './packages/**' -r publish --access public --no-git-checks --tag "$RELEASE_TAG"
