// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const prog = (t, a, b) => ease(clamp((t - a) / (b - a)));
const lerp = (a, b, k) => a + (b - a) * k;
const $ = (root, sel) => root.querySelector(sel);
const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
const blink = (t, hz = 2) => Math.floor(t * hz) % 2 ? 1 : .2;
const mix = (a, b, k) => '#' + [0, 2, 4].map(i => Math.round(lerp(parseInt(a.substr(i + 1, 2), 16), parseInt(b.substr(i + 1, 2), 16), clamp(k))).toString(16).padStart(2, '0')).join('');

function addShot(el, markup, cls = '') {
  el.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 1280 720" class="shot ${cls}">${markup}</svg>`);
  return el.lastElementChild;
}
// Show exactly one shot of a scene: `list` is [[from, to, element], ...] in absolute seconds.
function cut(abs, list) {
  let hit = null;
  for (const [a, b, node] of list) if (abs >= a && abs < b) hit = node;
  for (const [, , node] of list) node.style.display = node === hit ? 'block' : 'none';
  return hit;
}

// Two-link arm drawn into an SVG <g>. Returns a setter for the fingertip.
function makeArm(g, base, L1, L2, side = 1, scale = 1) {
  const w = s => s * scale;
  g.innerHTML = `
    <rect x="${base.x - w(60)}" y="${base.y - w(10)}" width="${w(120)}" height="${w(40)}" rx="${w(8)}" fill="#3a424d"/>
    <line class="s1o" stroke="#5d6774" stroke-width="${w(38)}" stroke-linecap="round"/>
    <line class="s1" stroke="#cdd4dc" stroke-width="${w(28)}" stroke-linecap="round"/>
    <line class="s2o" stroke="#5d6774" stroke-width="${w(28)}" stroke-linecap="round"/>
    <line class="s2" stroke="#e3e8ee" stroke-width="${w(20)}" stroke-linecap="round"/>
    <circle cx="${base.x}" cy="${base.y}" r="${w(26)}" fill="#2b323b" stroke="#6b7684" stroke-width="${w(4)}"/>
    <circle class="j1" r="${w(16)}" fill="#2b323b" stroke="#6b7684" stroke-width="${w(4)}"/>
    <circle class="tip" r="${w(9)}" fill="#9aa4b1"/>
    <circle class="glow" r="${w(5)}" fill="#36c5f0" opacity="0"/>`;
  const set = (sel, a, b) => { const l = $(g, sel); l.setAttribute('x1', a.x); l.setAttribute('y1', a.y); l.setAttribute('x2', b.x); l.setAttribute('y2', b.y); };
  return (tx, ty, glow = 0) => {
    const dx = tx - base.x, dy = ty - base.y;
    const d = Math.max(1, Math.min(Math.hypot(dx, dy), L1 + L2 - 1));
    const a = Math.atan2(dy, dx);
    const off = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
    const e = { x: base.x + L1 * Math.cos(a + off * side), y: base.y + L1 * Math.sin(a + off * side) };
    const p = { x: base.x + d * Math.cos(a), y: base.y + d * Math.sin(a) };
    set('.s1o', base, e); set('.s1', base, e); set('.s2o', e, p); set('.s2', e, p);
    const j = $(g, '.j1'); j.setAttribute('cx', e.x); j.setAttribute('cy', e.y);
    for (const c of g.querySelectorAll('.tip,.glow')) { c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); }
    $(g, '.glow').setAttribute('opacity', glow);
  };
}

        <ellipse cx="820" cy="380" rx="78" ry="92" fill="url(#rim${u})"/>
        <path d="M748 340 Q760 270 830 280 Q900 285 896 350 Q870 310 820 318 Q770 320 748 340 Z" fill="#141a21"/>
      </g>
    </g>`, 'iv');
  const cam = $(svg, '.cam'), person = $(svg, '.person');

      person.setAttribute('transform', `rotate(${nod} 820 600) translate(0 ${Math.sin(t * 1.6) * 2})`);
    },
  };
}

  const setArm = makeArm($(svg, '.arm'), { x: 640, y: 650 }, 230, 220, 1, .7);

  const defaults = { rear: [640, 380, 1], driver: [500, 330, 1.45], passenger: [790, 330, 1.45] }[view];
  return {

      world.setAttribute('transform', `translate(640 360) scale(${s}) translate(${-cx} ${-cy})`);
      disp.setAttribute('opacity', on);
      setArm(tip[0], tip[1] + (press ? 3 : 0), press ? 1 : 0);
      tiles.forEach((el, i) => el.setAttribute('fill', i === hl ? '#2a5578' : '#1a2b3d'));
      if (ripple) { rip.setAttribute('cx', ripple[0]); rip.setAttribute('cy', ripple[1]); rip.setAttribute('r', ripple[2] * 50); }

// Arm choreography: visit tiles in order, tapping each. stops = [[time, tileIndex], ...]
function tapPath(t, stops) {
  let tip = ARM_REST, press = 0, hl = -1, ripple = null;
  stops.forEach(([at, idx], i) => {
    const from = i ? TILES[stops[i - 1][1]].slice(1) : ARM_REST, to = TILES[idx].slice(1);
    if (t >= at - .5) tip = [lerp(from[0], to[0], prog(t, at - .5, at)), lerp(from[1], to[1], prog(t, at - .5, at))];
    if (t > at && t < at + .22) { press = 1; hl = idx; }
    if (t > at && t < at + .7) ripple = [...to, (t - at) / .7];
  });
  return { tip, press, hl, ripple };
}

    $(el, '.all').setAttribute('transform', `translate(640 360) scale(${lerp(1, 1.06, prog(abs, 58.6, 62))}) translate(-640 -360)`);
    $(el, '.prompt').textContent = prompt.slice(0, Math.round(prompt.length * clamp((abs - 47.3) / 1.6)));
    $(el, '.logs').innerHTML = logs.filter(([s]) => abs >= s).map(([, s], i) =>
      `<text x="92" y="${240 + i * 40}" fill="${s.startsWith('✓') ? '#1a9d55' : '#3a404a'}">${s}</text>`).join('');
    $(el, '.flash').setAttribute('opacity', abs > 52.3 ? .7 * (1 - clamp((abs - 52.3) / .35)) : 0);
    $(el, '.box').setAttribute('opacity', prog(abs, 52.7, 53.0) * (1 - prog(abs, 56.3, 56.7)));
    const reach = prog(abs, 53.6, 54.2) * (1 - prog(abs, 56.0, 56.8));
    const tap = abs > 54.3 && abs < 54.55 || abs > 54.9 && abs < 55.15;
    const bob = abs > 54.55 && abs < 54.9 ? 18 : 0;
    setArm(lerp(rest[0], 810, reach), lerp(rest[1], 300, reach) + bob + (tap ? -3 : 0), tap ? 1 : 0);
    const lastTap = abs > 54.9 ? 54.9 : 54.3, rr = clamp((abs - lastTap) / .6);
    const rip = $(el, '.ripple'); rip.setAttribute('r', rr * 60); rip.setAttribute('opacity', abs > 54.3 && rr < 1 ? 1 - rr : 0);
    $(el, '.temp').textContent = abs > 54.95 ? '22°' : abs > 54.35 ? '23°' : '24°';
    $(el, '.pass').setAttribute('opacity', prog(abs, 56.0, 56.4));
    $(el, '.rec').setAttribute('opacity', blink(abs));
    chips.style.opacity = prog(abs, 51.8, 52.2) * (1 - prog(abs, 58.3, 58.8));
    [52.3, 54.2, 55.9].forEach((s, i) => chipEls[i].classList.toggle('on', abs >= s));
  };
})();

// ---------- scene 6: off-the-shelf industrial products, small team, big problem ----------
const scene6 = (() => {
  const el = document.getElementById('s6');
  const iv = interview(el), P = cabin(el, 'passenger'), D = camClose(el), R = cabin(el, 'rear'), A = drone(el), B = dolly(el);
  return t => {
    const abs = t + 62;
    const shot = cut(abs, [[62, 65.83, iv.el], [65.83, 66.66, P.el], [66.66, 67.64, D.el], [67.64, 69.9, R.el],
      [69.9, 71.66, iv.el], [71.66, 74.4, A.el], [74.4, 76, B.el]]);
    if (shot === iv.el) iv.update(t, abs < 69 ? 1.12 : 1.2, (abs < 64.5) || (abs > 69.9 && abs < 71.3));
    if (shot === P.el) P.update({ t: abs, ...tapPath(abs, [[66.1, 1], [66.55, 3]]) });
    if (shot === D.el) D.update({ t: abs, k: prog(abs, 66.66, 67.64) });
    if (shot === R.el) {
      const k = prog(abs, 67.64, 69.9);
      R.update({ t: abs, ...tapPath(abs, [[68.2, 2], [69.0, 0]]), cy: lerp(400, 380, k), s: lerp(1.7, 1, k) });
    }
    if (shot === A.el) A.update({ t: abs, x: -200 - 600 * prog(abs, 71.66, 74.6), statusOn: prog(abs, 71.8, 73.4) });
    if (shot === B.el) B.update({ t: abs, u: abs - 74.4 + 1 });
  };
})();

// ---------- scene 7: pitfalls, listed ----------
const scene7 = (() => {
  const el = document.getElementById('s7');
  const iv = interview(el);
  const cols = [40, 453, 866], W = 374;
  const grid = [];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) grid.push([cols[2] + 37 + c * 62, 190 + r * 62]);
  const pit = addShot(el, `
    <rect width="1280" height="720" fill="#07090b"/>
    ${cols.map((x, i) => `<g class="pane">
      <rect class="frame" x="${x}" y="110" width="${W}" height="460" rx="18" fill="#0f1318" stroke="#2a313a" stroke-width="2"/>
      <text x="${x + W / 2}" y="80" fill="#e8ecf1" font-size="28" font-weight="600" text-anchor="middle">${['机械臂力度', '相机画面矫正', '量产前批量部署'][i]}</text>
    </g>`).join('')}
    <rect x="${cols[0] + 250}" y="170" width="16" height="250" rx="4" fill="#36c5f0" opacity=".5"/>
    <g class="finger"><rect x="${cols[0] + 20}" y="282" width="200" height="26" rx="13" fill="#cdd4dc"/><circle cx="${cols[0] + 220}" cy="295" r="16" fill="#9aa4b1"/></g>
    <rect x="${cols[0] + 40}" y="470" width="${W - 80}" height="18" rx="9" fill="#ff5d5d" opacity=".5"/>
    <rect x="${cols[0] + 40 + (W - 80) * .35}" y="470" width="${(W - 80) * .3}" height="18" fill="#3ddc84" opacity=".8"/>
    <path class="needle" d="M0 -6 L10 -22 L-10 -22 Z" fill="#fff"/>
    <text class="force" x="${cols[0] + W / 2}" y="535" font-size="22" text-anchor="middle"></text>
    <g class="lens" fill="none" stroke-width="2.5"></g>
    <text class="lenslabel" x="${cols[1] + W / 2}" y="535" font-size="22" text-anchor="middle"></text>
    ${grid.map(([x, y]) => `<rect class="unit" x="${x}" y="${y}" width="50" height="44" rx="10" fill="#1f252d"/>`).join('')}
    <text class="fleet" x="${cols[2] + W / 2}" y="535" fill="#cbd3dd" font-size="22" text-anchor="middle"></text>`, 'pit');
  const panes = pit.querySelectorAll('.pane'), units = pit.querySelectorAll('.unit');
  const T = [78.15, 79.48, 81.15];
  return t => {
    const abs = t + 76;
    const shot = cut(abs, [[76, 78.0, iv.el], [78.0, 83.5, pit]]);
    if (shot === iv.el) { iv.update(t, 1.22, abs > 76.2 && abs < 77.65); return; }
    panes.forEach((p, i) => {
      p.setAttribute('opacity', abs >= T[i] ? 1 : .3);
      $(p, '.frame').setAttribute('stroke', abs >= T[i] && (i === 2 || abs < T[i + 1]) ? '#36c5f0' : '#2a313a');
    });
    // force: too light, too hard, then inside the safe window
    const f = abs < T[0] ? 0 : abs < T[0] + .4 ? .15 : abs < T[0] + .8 ? .9 : .5;
    const press = abs >= T[0] && abs < T[0] + 1.1 && Math.sin((abs - T[0]) * 18) > 0 ? 1 : 0;
    $(pit, '.finger').setAttribute('transform', `translate(${press * 14} 0)`);
    $(pit, '.needle').setAttribute('transform', `translate(${cols[0] + 40 + (W - 80) * f} 470)`);
    const okF = f > .3 && f < .7;
    $(pit, '.force').textContent = abs < T[0] ? '' : f < .3 ? '太轻：点不上' : f > .7 ? '太重：误触' : '✓ 力度落在安全区间';
    $(pit, '.force').setAttribute('fill', okF ? '#3ddc84' : '#ff8a8a');
    // distortion: barrel-curved grid straightens out
    const k = 1 - prog(abs, T[1] + .3, T[1] + 1.1);
    const x0 = cols[1] + 47, y0 = 150, S = 280, cx = x0 + S / 2, cy = y0 + S / 2, lines = [];
    for (let i = 0; i <= 6; i++) {
      const p = i / 6, y = y0 + S * p, x = x0 + S * p, bow = (p - .5) * 2 * 34 * k;
      lines.push(`<path d="M${x0} ${y} Q${cx} ${y + bow} ${x0 + S} ${y}"/>`, `<path d="M${x} ${y0} Q${x + bow} ${cy} ${x} ${y0 + S}"/>`);
    }
    $(pit, '.lens').innerHTML = lines.join('');
    $(pit, '.lens').setAttribute('stroke', k < .05 ? '#3ddc84' : '#f5b942');
    $(pit, '.lenslabel').textContent = abs < T[1] ? '' : k < .05 ? '✓ 已矫正' : '镜头畸变';
    $(pit, '.lenslabel').setAttribute('fill', k < .05 ? '#3ddc84' : '#f5b942');
    // fleet: units come online one by one
    const done = abs < T[2] ? 0 : Math.min(20, Math.floor((abs - T[2]) / 1.5 * 20));
    units.forEach((u, i) => u.setAttribute('fill', i < done ? '#3ddc84' : '#1f252d'));
    $(pit, '.fleet').textContent = abs < T[2] ? '' : `${done} / 20 台已标定上线`;
  };
})();

    if (shot === R.el) {
      const k = prog(abs, 85.84, 88.4), back = prog(abs, 86.6, 87.6);
      const [, tx, ty] = TILES[1];

const UPDATERS = { s1: scene1, s2: scene2, s3: scene3, s4: scene4, s5: scene5, s6: scene6, s7: scene7, s8: scene8 };

// ---------- player ----------
const audio = document.getElementById('audio'), stage = document.getElementById('stage'), viewport = document.getElementById('viewport');
const sub = document.getElementById('sub'), timeEl = document.getElementById('time'), playBtn = document.getElementById('play');
const timeline = document.getElementById('timeline'), playhead = document.getElementById('playhead'), notes = document.getElementById('notes');

SCENES.forEach(s => {
  const seg = document.createElement('div');
  seg.className = 'seg'; seg.dataset.id = s.id;
  seg.style.width = `${(s.end - s.start) / DURATION * 100}%`;
  seg.textContent = s.title;
  timeline.insertBefore(seg, playhead);
});
CUES.forEach(([a, b]) => {
  const vo = document.createElement('div');
  vo.className = 'vo';
  vo.style.left = `${a / DURATION * 100}%`; vo.style.width = `${(b - a) / DURATION * 100}%`;
  timeline.appendChild(vo);
});

let fallbackT = 0, fallbackPlaying = false, lastFrame = 0, currentScene = null;
const audioOk = () => audio.readyState >= 1 && !audio.error;
const now = () => audioOk() ? audio.currentTime : fallbackT;
const playing = () => audioOk() ? !audio.paused : fallbackPlaying;

function seek(t) {
  t = clamp(t, 0, DURATION - .01);
  if (audioOk()) audio.currentTime = t; else fallbackT = t;
  render(t);
}
function toggle() {
  if (now() >= DURATION - .05) seek(0);
  if (audioOk()) audio.paused ? audio.play() : audio.pause(); else fallbackPlaying = !fallbackPlaying;
}
playBtn.onclick = toggle;
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight') seek(now() + 5);
  if (e.code === 'ArrowLeft') seek(now() - 5);
});
timeline.addEventListener('click', e => {
  const r = timeline.getBoundingClientRect();
  seek((e.clientX - r.left) / r.width * DURATION);
});

function showNotes(s) {
  notes.innerHTML = `
    <div><div class="shotname">${s.title}</div><div class="range">${fmt(s.start)} – ${fmt(s.end)}</div></div>
    <dl><dt>画面</dt><dd>${s.pic}</dd><dt>拍摄</dt><dd>${s.cam}</dd>${s.todo ? `<dt>待定</dt><dd class="todo">${s.todo}</dd>` : ''}</dl>`;
}

function render(t) {
  const s = SCENES.find(s => t >= s.start && t < s.end) || SCENES[SCENES.length - 1];
  if (s !== currentScene) {
    SCENES.forEach(x => document.getElementById(x.id).style.display = x === s ? 'block' : 'none');
    timeline.querySelectorAll('.seg').forEach(seg => seg.classList.toggle('active', seg.dataset.id === s.id));
    showNotes(s);
    currentScene = s;
  }
  UPDATERS[s.id](t - s.start);
  const cue = CUES.find(([a, b]) => t >= a && t < b);
  sub.textContent = cue ? cue[2] : '';
  playhead.style.left = `${t / DURATION * 100}%`;
  timeEl.textContent = `${fmt(t)} / ${fmt(DURATION)}`;
  playBtn.textContent = playing() ? '❚❚ 暂停' : '▶ 播放';
}

function frame(ts) {
  const dt = lastFrame ? (ts - lastFrame) / 1000 : 0; lastFrame = ts;
  if (!audioOk() && fallbackPlaying) { fallbackT += dt; if (fallbackT >= DURATION) { fallbackT = DURATION - .01; fallbackPlaying = false; } }
  render(now());
  requestAnimationFrame(frame);
}

function fit() { stage.style.transform = `scale(${viewport.clientWidth / 1280})`; }
window.addEventListener('resize', fit); fit();
// Export mode (?export): no audio, frames are driven by window.__frame(t).
if (location.search.includes('export')) {
  audio.removeAttribute('src'); audio.load();
  document.body.classList.add('export');
  window.__frame = t => { fallbackT = t; render(t); };
}
const hashT = parseFloat((location.hash.match(/t=([\d.]+)/) || [])[1]);
if (!isNaN(hashT)) fallbackT = hashT;
render(now());
audio.addEventListener('loadedmetadata', () => { if (!isNaN(hashT)) seek(hashT); });
requestAnimationFrame(frame);
</script>
